plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ayan.youtubelegacy'
    compileSdk 34

    defaultConfig {
        applicationId "com.ayan.youtubelegacy"

        minSdk 22
        targetSdk 28

        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false

            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_8
        targetCompatibility JavaVersion.VERSION_8
    }
}