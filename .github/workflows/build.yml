name: Build YouTube Legacy APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # 3. Configure Android SDK
      # --------------------------------------------------

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"


      # --------------------------------------------------
      # 4. Locate SDK Manager
      # --------------------------------------------------

      - name: Locate SDK Manager
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager found:"
            command -v sdkmanager
            sdkmanager --version

          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            echo "Using cmdline-tools 16.0"
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --version

          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Using latest cmdline-tools"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

          else
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME" -name sdkmanager -type f -print
            exit 1
          fi


      # --------------------------------------------------
      # 5. Accept Android licenses
      # --------------------------------------------------

      - name: Accept Android SDK licenses
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"

          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "$SDKMANAGER" --licenses || true


      # --------------------------------------------------
      # 6. Install Android SDK
      # --------------------------------------------------

      - name: Install Android SDK packages
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"

          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"


      # --------------------------------------------------
      # 7. Setup Gradle 7.5
      # --------------------------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.5"


      # --------------------------------------------------
      # 8. Check build environment
      # --------------------------------------------------

      - name: Check build environment
        run: |
          java -version
          gradle --version


      # --------------------------------------------------
      # 9. Build Release APK
      # --------------------------------------------------

      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace


      # --------------------------------------------------
      # 10. Check generated APK
      # --------------------------------------------------

      - name: Check APK
        run: |
          echo "Release files:"
          ls -lh app/build/outputs/apk/release/

          test -f app/build/outputs/apk/release/app-release-unsigned.apk


      # --------------------------------------------------
      # 11. Prepare APK
      # --------------------------------------------------

      - name: Prepare APK
        run: |
          mkdir -p output

          cp \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            output/YouTube-Legacy-Android5.apk


      # --------------------------------------------------
      # 12. Upload APK
      # --------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Legacy-Android5
          path: output/YouTube-Legacy-Android5.apk
          if-no-files-found: error
