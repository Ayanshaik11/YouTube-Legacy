name: Build YouTube Legacy APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Java 17
      # Required by the current Android SDK command-line tools.
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # 3. Show Android SDK information
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version


      # 4. Accept Android SDK licenses
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true


      # 5. Install required Android SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"


      # 6. Setup Gradle 7.5
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.5"


      # 7. Verify Gradle
      - name: Check Gradle
        run: |
          gradle --version


      # 8. Build release APK
      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace


      # 9. Check APK
      - name: Check APK
        run: |
          ls -lh app/build/outputs/apk/release/
          file app/build/outputs/apk/release/app-release.apk


      # 10. Rename APK
      - name: Prepare APK
        run: |
          mkdir -p output

          cp app/build/outputs/apk/release/app-release.apk \
             output/YouTube-Legacy-Android5.apk


      # 11. Upload APK as GitHub Actions artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Legacy-Android5
          path: output/YouTube-Legacy-Android5.apk
          if-no-files-found: error
