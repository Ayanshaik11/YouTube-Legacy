name: Build YouTube Legacy APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      # 1. Checkout project
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Setup Java 17
      # Android SDK command-line tools require JDK 17+
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # 4. Install Android SDK components
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"


      # 5. Setup Gradle 7.5
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.5"


      # 6. Build Release APK
      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace


      # 7. Prepare APK
      - name: Prepare APK
        run: |
          mkdir -p output

          cp app/build/outputs/apk/release/app-release.apk \
             output/YouTube-Legacy-Android5.apk


      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Legacy-Android5
          path: output/YouTube-Legacy-Android5.apk
          if-no-files-found: error
