name: Build YouTube Legacy APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Java 17
      # --------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # 3. Configure Android SDK
      # --------------------------------------------------

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"


      # --------------------------------------------------
      # 4. Locate SDK Manager
      # --------------------------------------------------

      - name: Locate SDK Manager
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager found:"
            command -v sdkmanager
            sdkmanager --version

          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            echo "Using cmdline-tools 16.0"
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --version

          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Using latest cmdline-tools"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

          else
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME" -name sdkmanager -type f -print
            exit 1
          fi


      # --------------------------------------------------
      # 5. Accept Android SDK licenses
      # --------------------------------------------------

      - name: Accept Android SDK licenses
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"

          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "$SDKMANAGER" --licenses || true


      # --------------------------------------------------
      # 6. Install Android SDK packages
      # --------------------------------------------------

      - name: Install Android SDK packages
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"

          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"


      # --------------------------------------------------
      # 7. Setup Gradle 7.5
      # --------------------------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.5"


      # --------------------------------------------------
      # 8. Restore JKS signing keystore
      # --------------------------------------------------

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "Restoring signing keystore..."

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > youtube-legacy-release.jks

          test -s youtube-legacy-release.jks

          echo "Verifying JKS keystore..."

          keytool -list \
            -v \
            -keystore youtube-legacy-release.jks \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEYSTORE_PASSWORD"

          echo "Keystore restored and private key verified successfully."


      # --------------------------------------------------
      # 9. Check build environment
      # --------------------------------------------------

      - name: Check build environment
        run: |
          java -version
          gradle --version


      # --------------------------------------------------
      # 10. Build signed Release APK
      # --------------------------------------------------

      - name: Build signed Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/youtube-legacy-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace


      # --------------------------------------------------
      # 11. Check generated APK
      # --------------------------------------------------

      - name: Check signed APK
        run: |
          echo "Release files:"
          ls -lh app/build/outputs/apk/release/

          test -f app/build/outputs/apk/release/app-release.apk


      # --------------------------------------------------
      # 12. Verify APK signature
      # --------------------------------------------------

      - name: Verify APK signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          echo "Verifying APK signature..."

          "$APKSIGNER" verify \
            --verbose \
            app/build/outputs/apk/release/app-release.apk

          echo "APK signature verified successfully."


      # --------------------------------------------------
      # 13. Prepare APK
      # --------------------------------------------------

      - name: Prepare APK
        run: |
          mkdir -p output

          cp \
            app/build/outputs/apk/release/app-release.apk \
            output/YouTube-Legacy-Android5.apk

          echo "Final APK:"
          ls -lh output/YouTube-Legacy-Android5.apk


      # --------------------------------------------------
      # 14. Upload signed APK
      # --------------------------------------------------

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Legacy-Android5
          path: output/YouTube-Legacy-Android5.apk
          if-no-files-found: error


      # --------------------------------------------------
      # 15. Remove temporary keystore
      # --------------------------------------------------

      - name: Remove temporary keystore
        if: always()
        run: |
          rm -f youtube-legacy-release.jks

          echo "Temporary keystore removed."
